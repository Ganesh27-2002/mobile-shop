name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full-Stack Verification & Playwright Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: mobile_shop_test
      DB_NAME_TEST: mobile_shop_test
      DB_USER: postgres
      DB_PASSWORD: 123456
      JWT_SECRET: test-only-jwt-secret-key-3.0
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Wait for PostgreSQL readiness
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL database container to be ready..."
            sleep 2
          done
          echo "PostgreSQL is online and accepting connections."

      - name: Run Sequelize database migrations
        working-directory: ./backend
        run: npm run db:migrate

      - name: Run Sequelize database seeders
        working-directory: ./backend
        run: npm run db:seed

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright browsers & dependencies
        run: |
          npx playwright install --with-deps
          npx playwright install chrome

      - name: Verify application startup & backend health check
        run: npx playwright test tests/smoke.spec.ts

      - name: Run complete Playwright test suite (317 tests)
        run: npm test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
